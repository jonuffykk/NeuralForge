; NeuralForge configuration.
;
; You do not need to edit this file. The installer sets everything with sliders
; and seeds the rest from your GPU tier. Full reference: docs/PERFORMANCE_GUIDE.md
;
; Unknown keys are ignored, so this file is safe across versions.

[General]
Enabled              = true
Backend              = auto
Model                = auto
Placement            = deferred

[Look]
Structure            = 1.0
Tone                 = 1.0
SkinStructure        = 1.0
SkinTone             = 1.0
FoliageStructure     = 1.0
FoliageTone          = 1.0

[Performance]
AutoTune             = true
BudgetMs             = 2.0
WorkingScale         = 1.0
Passes               = 1
Cadence              = 1
SelectiveMultipass   = true
TileThreshold        = 0.02

[Safety]
BlockOnAntiCheat     = true
AllowFp16Fallback    = true
RequireMotionVectors = true
AllowD3D11Bridge     = true
AllowOpticalFlow     = false
RuntimePath          =

[UI]
OverlayHotkey        = 0x2D
ShowStats            = false
